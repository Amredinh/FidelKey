name: Build FidelKey

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Build and Test Engine
      run: |
        cd engine
        mkdir build -Force
        cd build
        cmake .. -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build . --config Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        echo "Running engine tests..."
        ctest --output-on-failure -C Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        echo "Engine tests completed successfully"
    
  build-tsf:
    runs-on: windows-latest
    needs: [build-engine]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Build TSF Service
      run: |
        cd tsf-service
        mkdir build -Force
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build . --config Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        echo "TSF service built successfully"
    
    - name: Upload TSF artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: fidelkey-tsf
        path: tsf-service/build/Release/*.dll
        if-no-files-found: ignore
    
  build-settings:
    runs-on: windows-latest
    needs: [build-engine]
    continue-on-error: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    
    - name: Install Tauri CLI
      run: cargo install tauri-cli --version "^2.0.0" --locked 2>&1 | tail -5
    
    - name: Build Tauri Settings App (UNFINISHED - may fail)
      run: |
        cd settings-app
        if (Test-Path "package.json") {
          npm ci
          npm run tauri build 2>&1 | tail -20
        } else {
          echo "Settings app not yet implemented"
        }
    
    - name: Upload settings artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fidelkey-settings
        path: settings-app/src-tauri/target/release/bundle/
        if-no-files-found: ignore
